<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="ดูทีวีไทยฟรี เลือกช่องแล้วรับชมได้ทันทีบนมือถือและ iPad" />
    <title>ดูทีวีออนไลน์ - HK IPTV</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://live-us1.thaimomo.com" crossorigin />
    <link rel="dns-prefetch" href="https://live-us1.thaimomo.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer></script>
  </head>
  <body>
    <main class="content">
      <p id="status" class="status">กำลังโหลดช่อง...</p>
      <div id="grid" class="grid" hidden></div>
    </main>

    <div id="player" class="player" hidden>
      <div id="stage" class="player-stage">
        <video
          id="video"
          playsinline
          webkit-playsinline
          preload="auto"
        ></video>

        <div id="loader" class="loader" hidden>
          <span class="loader-spinner" aria-hidden="true"></span>
        </div>

        <button id="unmute" class="unmute" type="button" hidden>แตะเพื่อเล่น</button>

        <div id="controls" class="controls" hidden>
          <div class="controls-top">
            <img id="barLogo" class="controls-logo" alt="" hidden />
            <span id="barTitle" class="controls-title">ทีวีฟรี</span>
          </div>

          <div class="controls-center">
            <div class="control">
              <button id="backBtn" class="icon-btn icon-btn-lg" type="button" aria-label="Exit" title="Exit">
                <svg class="icon-back" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M0 0h24v24H0z" fill="none" />
                  <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H14.5C14.22386 10 14 9.77614 14 9.5V3M14.6 9.4L21 3M3 14H9.5C9.77614 14 10 14.22386 10 14.5V21M9.4 14.6L3 21" />
                </svg>
              </button>
              <span class="control-label">Exit</span>
            </div>
            <div class="control">
              <button id="playBtn" class="icon-btn icon-btn-lg icon-btn-xl" type="button" aria-label="เล่น/หยุด" title="เล่น/หยุด">
                <span id="playIcon" class="icon-play" aria-hidden="true"></span>
              </button>
              <span id="playLabel" class="control-label">Play</span>
            </div>
            <div class="control">
              <button id="epgBtn" class="icon-btn icon-btn-lg" type="button" aria-label="ผังรายการ" title="ผังรายการ">
                <svg class="icon-epg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
                  <path d="M0 0h512v512H0z" fill="none" />
                  <path fill="currentColor" d="M64 144a48 48 0 1 0 0-96a48 48 0 1 0 0 96m128-80c-17.7 0-32 14.3-32 32s14.3 32 32 32h288c17.7 0 32-14.3 32-32s-14.3-32-32-32zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32h288c17.7 0 32-14.3 32-32s-14.3-32-32-32zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32h288c17.7 0 32-14.3 32-32s-14.3-32-32-32zM64 464a48 48 0 1 0 0-96a48 48 0 1 0 0 96m48-208a48 48 0 1 0-96 0a48 48 0 1 0 96 0" />
                </svg>
              </button>
              <span class="control-label">EPG</span>
            </div>
          </div>
        </div>

        <div id="epgPopup" class="epg-popup" hidden>
          <div class="epg-popup-panel">
            <div class="epg-popup-head">
              <span class="epg-popup-title">ผังรายการ</span>
              <button id="epgClose" class="icon-btn icon-btn-round" type="button" aria-label="ปิด">
                <span class="icon-close" aria-hidden="true"></span>
              </button>
            </div>
            <div id="epgList" class="epg-popup-list"></div>
          </div>
        </div>

        <section id="fallback" class="fallback fallback-overlay" hidden>
          <p class="fallback-msg" id="errorMsg"></p>
          <div class="fallback-actions">
            <button class="btn" type="button" id="retryBtn">ลองใหม่</button>
            <button class="btn btn-ghost" type="button" id="copyBtn">คัดลอกลิงก์สตรีม</button>
          </div>
          <p class="muted small">
            นำลิงก์ไปเปิดใน APTV, VLC หรือ Safari ซึ่งรองรับสตรีมที่ไม่มี CORS และการตั้งค่า Referer/User-Agent
          </p>
          <button class="link-btn" type="button" id="fallbackBack">กลับไปหน้ารายการช่อง</button>
        </section>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
