<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="ดูทีวีไทยฟรี เลือกช่องแล้วรับชมได้ทันทีบนมือถือและ iPad" />
    <title>ดูทีวีออนไลน์ - HK IPTV</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://live-us1.thaimomo.com" crossorigin />
    <link rel="dns-prefetch" href="https://live-us1.thaimomo.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer></script>
  </head>
  <body>
    <main class="content">
      <p id="status" class="status">กำลังโหลดช่อง...</p>
      <div id="grid" class="grid" hidden></div>
    </main>

    <footer class="app-footer">
      <span>อัปเดตล่าสุด: <time id="appVersion">__APP_VERSION__</time></span>
    </footer>

    <div id="player" class="player" hidden>
      <div id="stage" class="player-stage">
        <video id="video" playsinline webkit-playsinline preload="auto"></video>

        <div id="loader" class="loader" hidden>
          <span class="loader-spinner" aria-hidden="true"></span>
        </div>

        <button id="unmute" class="unmute" type="button" hidden>แตะเพื่อเล่น</button>

        <div id="controls" class="controls" hidden>
          <div class="controls-top">
            <img id="barLogo" class="controls-logo" alt="" hidden />
            <span id="barTitle" class="controls-title">ดูทีวีออนไลน์</span>
          </div>

          <div class="controls-center">
            <div class="control">
              <button
                id="backBtn"
                class="icon-btn icon-btn-lg"
                type="button"
                aria-label="Exit"
                title="Exit"
              >
                <svg
                  class="icon-back"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M0 0h24v24H0z" fill="none" />
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m5 12l4-4m-4 4l4 4m-4-4H15m-5 9a9 9 0 1 0 0-18"
                  />
                </svg>
              </button>
              <span class="control-label">Exit</span>
            </div>
            <div class="control">
              <button
                id="pinBtn"
                class="icon-btn icon-btn-lg"
                type="button"
                aria-label="ปักหมุดช่อง"
                title="ปักหมุดช่อง"
                aria-pressed="false"
              >
                <svg
                  class="icon-pin"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"
                  />
                </svg>
              </button>
              <span id="pinLabel" class="control-label">Pin</span>
            </div>
            <div class="control">
              <button
                id="playBtn"
                class="icon-btn icon-btn-lg icon-btn-xl"
                type="button"
                aria-label="เล่น/หยุด"
                title="เล่น/หยุด"
              >
                <span id="playIcon" class="icon-play" aria-hidden="true"></span>
              </button>
              <span id="playLabel" class="control-label">Play</span>
            </div>
            <div class="control">
              <button
                id="muteBtn"
                class="icon-btn icon-btn-lg"
                type="button"
                aria-label="ปิดเสียง"
                title="ปิดเสียง"
                aria-pressed="false"
              >
                <svg
                  class="icon-volume icon-volume-on"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 36 36"
                  aria-hidden="true"
                >
                  <path d="M0 0h36v36H0z" fill="none" />
                  <path
                    fill="currentColor"
                    d="M23.41 25.25a1 1 0 0 1-.54-1.85a6.21 6.21 0 0 0-.19-10.65a1 1 0 1 1 1-1.73a8.21 8.21 0 0 1 .24 14.06a1 1 0 0 1-.51.17"
                  />
                  <path
                    fill="currentColor"
                    d="M25.62 31.18a1 1 0 0 1-.45-1.89A12.44 12.44 0 0 0 25 6.89a1 1 0 1 1 .87-1.8a14.44 14.44 0 0 1 .24 26a1 1 0 0 1-.49.09"
                  />
                  <path
                    fill="currentColor"
                    d="m18.33 4l-9.26 8h-6a1 1 0 0 0-1 1v9.92a1 1 0 0 0 1 1h5.81l9.46 8.24a1 1 0 0 0 1.66-.73V4.72A1 1 0 0 0 18.33 4"
                  />
                </svg>
                <svg
                  class="icon-volume icon-volume-off"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 36 36"
                  aria-hidden="true"
                >
                  <path d="M0 0h36v36H0z" fill="none" />
                  <path
                    fill="currentColor"
                    d="M24.87 6.69a12.42 12.42 0 0 1 3.88 19.61l1.42 1.42a14.43 14.43 0 0 0-4.43-22.84a1 1 0 0 0-.87 1.8Z"
                  />
                  <path
                    fill="currentColor"
                    d="m27.3 27.67l-3.84-3.84l-.57-.57L4.63 5L3.21 6.41L8.8 12H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h5.83l9.51 8.3a1 1 0 0 0 1.66-.75V23.2l5.59 5.59c-.17.1-.34.2-.51.29a1 1 0 0 0 .9 1.79c.37-.19.72-.4 1.08-.62l2.14 2.14L30.61 31l-3.25-3.25Z"
                  />
                  <path
                    fill="currentColor"
                    d="M22.69 12.62A6.27 6.27 0 0 1 25.8 18a6.17 6.17 0 0 1-1.42 3.92l1.42 1.42a8.16 8.16 0 0 0 2-5.34a8.28 8.28 0 0 0-4.1-7.11a1 1 0 1 0-1 1.73Z"
                  />
                  <path
                    fill="currentColor"
                    d="M20 4.62a1 1 0 0 0-1.66-.75l-6.42 5.6L20 17.54Z"
                  />
                </svg>
              </button>
              <span id="muteLabel" class="control-label">Mute</span>
            </div>
            <div class="control">
              <button
                id="epgBtn"
                class="icon-btn icon-btn-lg"
                type="button"
                aria-label="ผังรายการ"
                title="ผังรายการ"
              >
                <svg
                  class="icon-epg"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 512 512"
                  aria-hidden="true"
                >
                  <path d="M0 0h512v512H0z" fill="none" />
                  <path
                    fill="currentColor"
                    d="M64 144a48 48 0 1 0 0-96a48 48 0 1 0 0 96m128-80c-17.7 0-32 14.3-32 32s14.3 32 32 32h288c17.7 0 32-14.3 32-32s-14.3-32-32-32zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32h288c17.7 0 32-14.3 32-32s-14.3-32-32-32zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32h288c17.7 0 32-14.3 32-32s-14.3-32-32-32zM64 464a48 48 0 1 0 0-96a48 48 0 1 0 0 96m48-208a48 48 0 1 0-96 0a48 48 0 1 0 96 0"
                  />
                </svg>
              </button>
              <span class="control-label">EPG</span>
            </div>
          </div>
        </div>

        <div id="epgPopup" class="epg-popup" hidden>
          <div class="epg-popup-panel">
            <div class="epg-popup-head">
              <span class="epg-popup-title">ผังรายการ</span>
              <button id="epgClose" class="icon-btn icon-btn-round" type="button" aria-label="ปิด">
                <span class="icon-close" aria-hidden="true"></span>
              </button>
            </div>
            <div id="epgList" class="epg-popup-list"></div>
          </div>
        </div>

        <section id="fallback" class="fallback fallback-overlay" hidden>
          <div class="fallback-head">
            <img id="fallbackLogo" class="fallback-logo" alt="" hidden />
            <span id="fallbackName" class="fallback-name"></span>
          </div>
          <p class="fallback-msg" id="errorMsg"></p>
          <div class="fallback-actions">
            <button class="btn" type="button" id="retryBtn">ลองใหม่</button>
            <button class="btn btn-ghost" type="button" id="fallbackBack">
              กลับไปหน้ารายการช่อง
            </button>
          </div>
        </section>

        <div id="muteBadge" class="mute-badge" role="status" aria-label="ปิดเสียงอยู่" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" aria-hidden="true">
            <path d="M0 0h36v36H0z" fill="none" />
            <path
              fill="currentColor"
              d="M24.87 6.69a12.42 12.42 0 0 1 3.88 19.61l1.42 1.42a14.43 14.43 0 0 0-4.43-22.84a1 1 0 0 0-.87 1.8Z"
            />
            <path
              fill="currentColor"
              d="m27.3 27.67l-3.84-3.84l-.57-.57L4.63 5L3.21 6.41L8.8 12H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h5.83l9.51 8.3a1 1 0 0 0 1.66-.75V23.2l5.59 5.59c-.17.1-.34.2-.51.29a1 1 0 0 0 .9 1.79c.37-.19.72-.4 1.08-.62l2.14 2.14L30.61 31l-3.25-3.25Z"
            />
            <path
              fill="currentColor"
              d="M22.69 12.62A6.27 6.27 0 0 1 25.8 18a6.17 6.17 0 0 1-1.42 3.92l1.42 1.42a8.16 8.16 0 0 0 2-5.34a8.28 8.28 0 0 0-4.1-7.11a1 1 0 1 0-1 1.73Z"
            />
            <path fill="currentColor" d="M20 4.62a1 1 0 0 0-1.66-.75l-6.42 5.6L20 17.54Z" />
          </svg>
        </div>
      </div>
    </div>

    <div id="pinConfirm" class="pin-confirm" hidden>
      <div
        class="pin-confirm-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="pinConfirmMsg"
      >
        <p id="pinConfirmMsg" class="pin-confirm-msg"></p>
        <div class="pin-confirm-actions">
          <button id="pinConfirmCancel" class="btn btn-ghost" type="button">ยกเลิก</button>
          <button id="pinConfirmOk" class="btn" type="button">ยืนยัน</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
