name: update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Checkout EPG grabber
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: .epg
      - name: Install EPG dependencies
        run: npm install --no-audit --no-fund
        working-directory: .epg
      - name: Grab EPG
        continue-on-error: true
        working-directory: .epg
        run: |
          mkdir -p "${{ github.workspace }}/.gh-pages"
          npm run grab -- --channels=${{ github.workspace }}/.github/epg/channels.xml --output=${{ github.workspace }}/.gh-pages/guide.xml
      - name: Ensure guide exists
        run: |
          if [ ! -s .gh-pages/guide.xml ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<tv></tv>\n' > .gh-pages/guide.xml
          fi
      - name: Generate playlists
        run: npm run playlist:generate
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.gh-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
